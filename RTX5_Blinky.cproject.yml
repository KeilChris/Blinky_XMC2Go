project:
  packs:
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-RTX@^5.9.0
    - pack: Infineon::XMC1000_DFP@^2.12.0

  linker:
    - script: RTE/Device/XMC1100-Q024x0064/XMC1100x0064_ac6.sct
  groups:
    - group: Source Files
      files:
        - file: ./main.c
        - file: ./Blinky.c
        - file: ./Board_LED.h
    - group: Documentation
      files:
        - file: ./README.md
  components:
    - component: ARM::CMSIS:CORE
    - component: ARM::CMSIS:OS Tick:SysTick
    - component: Infineon::Board Support&XMC1100 XMC2GO Kit:LED
    - component: Infineon::Device:Startup
    - component: Infineon::Device:XMClib:GPIO
    - component: ARM::CMSIS:RTOS2:Keil RTX5&Source

  output:
    type:
      - elf
      - hex
      - map
