project:
  packs:
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-RTX@^5.9.0
    - pack: Infineon::XMC1000_DFP@^2.12.0
  setups:
    - setup: Options for XMC_2Go
      add-path:
        - .
      debug: "on"
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -ffunction-sections
            - -Wno-packed
            - -Wno-missing-variable-declarations
            - -Wno-missing-prototypes
            - -Wno-missing-noreturn
            - -Wno-sign-conversion
            - -Wno-nonportable-include-path
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
          CPP:
            - -xc++
            - -std=c++11
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: RTE/Device/XMC1100-Q024x0064/XMC1100x0064_ac6.sct
  groups:
    - group: Source Files
      files:
        - file: ./main.c
        - file: ./Blinky.c
        - file: ./Board_LED.h
    - group: Documentation
      files:
        - file: ./Abstract.txt
  components:
    - component: ARM::CMSIS:CORE
    - component: ARM::CMSIS:OS Tick:SysTick
    - component: Infineon::Board Support&XMC1100 XMC2GO Kit:LED
    - component: Infineon::Device:Startup
    - component: Infineon::Device:XMClib:GPIO
    - component: ARM::CMSIS:RTOS2:Keil RTX5&Source

  output:
    type:
      - elf
      - hex
      - map
